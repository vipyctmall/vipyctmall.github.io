<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWA 狀態檢查 | Vipyctmall</title><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/site.webmanifest?v=20260803-mobile-ui-v8"><style>body{margin:0;background:#07101f;color:#f8fafc;font-family:system-ui,sans-serif;padding:24px}main{max-width:760px;margin:auto}li{margin:12px 0;padding:12px;border-radius:12px;background:#0f1d34}.ok{border-left:5px solid #10b981}.bad{border-left:5px solid #ef4444}code{color:#93c5fd}</style></head><body><main><h1>Vipyctmall PWA 狀態檢查</h1><p>此頁只檢查 <code>https://vipyctmall.com/</code> 根目錄設定。</p><ul id="results"></ul></main><script>(async()=>{const out=document.getElementById('results');const add=(name,ok,detail='')=>{const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✓ ':'✗ ')+name+(detail?'：'+detail:'');out.appendChild(li)};add('目前網域',location.hostname==='vipyctmall.com',location.origin);try{const r=await fetch('/site.webmanifest?check=20260803-mobile-ui-v8',{cache:'no-store'});const m=await r.json();add('site.webmanifest',r.ok,`${m.name}／start_url=${m.start_url}／scope=${m.scope}`)}catch(e){add('site.webmanifest',false,e.message)}try{const r=await fetch('/sw.js?check=20260803-mobile-ui-v8',{cache:'no-store'});add('sw.js',r.ok,r.status)}catch(e){add('sw.js',false,e.message)}try{const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});await reg.update();add('Service Worker 註冊',true,reg.scope)}catch(e){add('Service Worker 註冊',false,e.message)}for(const p of ['/assets/brand/vipyctmall-icon-max-192.png','/assets/brand/vipyctmall-icon-max-512.png','/assets/js/pwa-install.js']){try{const r=await fetch(p+'?check=20260803-mobile-ui-v8',{cache:'no-store'});add(p,r.ok,r.status)}catch(e){add(p,false,e.message)}}})();</script></body></html>
