<!DOCTYPE html>

<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Vipyctmall 全球即時訪客統計 | AKG Global 電視牆</title>
<link href="https://vipyctmall.com/viewed-tv.html" rel="canonical"/>
<meta content="AKG Global 15 語系即時訪客統計電視牆。" name="description"/>
<meta content="noindex,nofollow,noarchive,nosnippet" name="robots"/>
<meta content="dark" name="color-scheme"/>
<style>
    :root{
      --bg:#030712;
      --panel:rgba(15,23,42,.82);
      --panel-strong:rgba(15,23,42,.95);
      --line:rgba(148,163,184,.16);
      --text:#f8fafc;
      --muted:#94a3b8;
      --blue:#60a5fa;
      --cyan:#22d3ee;
      --gold:#fbbf24;
      --green:#34d399;
      --red:#fb7185;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      color:var(--text);
      background:
        radial-gradient(circle at 15% 0%,rgba(37,99,235,.24),transparent 34%),
        radial-gradient(circle at 90% 20%,rgba(8,145,178,.18),transparent 28%),
        linear-gradient(150deg,#020617 0%,#071225 52%,#020617 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:52px 52px;
      mask-image:linear-gradient(to bottom,black,transparent 80%);
    }
    .wall{
      position:relative;
      z-index:1;
      width:100vw;
      height:100vh;
      min-height:560px;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      gap:clamp(10px,1.2vh,18px);
      padding:clamp(14px,1.8vw,34px);
    }
    .header{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      gap:clamp(14px,1.6vw,28px);
      align-items:center;
    }
    .brand{min-width:0}
    .eyebrow{
      color:var(--cyan);
      font-weight:900;
      letter-spacing:.2em;
      text-transform:uppercase;
      font-size:clamp(10px,.7vw,14px);
    }
    h1{
      margin:.25em 0 0;
      font-size:clamp(28px,2.8vw,58px);
      line-height:1;
      letter-spacing:-.035em;
      white-space:nowrap;
    }
    .total-box{
      min-width:clamp(210px,18vw,360px);
      border:1px solid rgba(96,165,250,.28);
      background:linear-gradient(145deg,rgba(30,64,175,.38),rgba(15,23,42,.76));
      box-shadow:0 20px 60px rgba(2,6,23,.34),inset 0 1px 0 rgba(255,255,255,.05);
      border-radius:clamp(16px,1.2vw,26px);
      padding:clamp(12px,1.2vw,22px) clamp(16px,1.4vw,28px);
      text-align:right;
    }
    .total-box span{
      display:block;
      color:#cbd5e1;
      font-size:clamp(11px,.8vw,16px);
      font-weight:700;
      letter-spacing:.08em;
    }
    .total-box strong{
      display:block;
      margin-top:.05em;
      color:var(--gold);
      font-size:clamp(34px,3.7vw,76px);
      line-height:1;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 24px rgba(251,191,36,.16);
    }
    .total-legend{
      display:block;
      margin-top:5px;
      color:#93c5fd;
      font-size:clamp(8px,.58vw,12px);
      font-weight:700;
      letter-spacing:.02em;
      white-space:nowrap;
    }
    .right-info{
      min-width:clamp(190px,16vw,310px);
      text-align:right;
    }
    .clock{
      font-size:clamp(24px,2.25vw,46px);
      font-weight:800;
      font-variant-numeric:tabular-nums;
      letter-spacing:.02em;
    }
    .date{
      color:var(--muted);
      margin-top:5px;
      font-size:clamp(11px,.85vw,17px);
    }
    .controls{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
      margin-top:8px;
    }
    .status-dot{
      width:9px;height:9px;border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 14px currentColor;
    }
    .status-dot.live{background:var(--green)}
    .status-dot.error{background:var(--red)}
    .status-text{
      color:var(--muted);
      font-size:clamp(10px,.72vw,14px);
      white-space:nowrap;
    }
    .icon-btn{
      border:1px solid var(--line);
      background:rgba(15,23,42,.76);
      color:#e2e8f0;
      width:clamp(30px,2.1vw,42px);
      height:clamp(30px,2.1vw,42px);
      border-radius:50%;
      cursor:pointer;
      display:grid;
      place-items:center;
      font-size:clamp(14px,1vw,19px);
    }
    .icon-btn:hover{border-color:var(--blue);background:rgba(30,64,175,.32)}
    .grid{
      min-height:0;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      grid-template-rows:repeat(3,minmax(0,1fr));
      gap:clamp(9px,.85vw,17px);
    }
    .card{
      position:relative;
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      border:1px solid var(--line);
      border-radius:clamp(14px,1vw,22px);
      padding:clamp(11px,1vw,20px);
      background:linear-gradient(145deg,rgba(15,23,42,.9),rgba(11,20,37,.7));
      box-shadow:0 14px 38px rgba(2,6,23,.24),inset 0 1px 0 rgba(255,255,255,.035);
    }
    .card::after{
      content:"";
      position:absolute;
      inset:auto -20% -55% 35%;
      height:100%;
      background:radial-gradient(circle,rgba(37,99,235,.13),transparent 66%);
      pointer-events:none;
    }
    .card.top-1{border-color:rgba(251,191,36,.5);background:linear-gradient(145deg,rgba(120,53,15,.34),rgba(15,23,42,.92))}
    .card.top-2{border-color:rgba(148,163,184,.45)}
    .card.top-3{border-color:rgba(217,119,6,.42)}
    .card.value-changed{animation:valuePulse .9s ease}
    @keyframes valuePulse{0%{box-shadow:0 0 0 rgba(34,211,238,0)}35%{box-shadow:0 0 34px rgba(34,211,238,.42);border-color:rgba(34,211,238,.75)}100%{box-shadow:0 14px 38px rgba(2,6,23,.24)}}
    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .language{
      display:flex;
      align-items:center;
      min-width:0;
      gap:clamp(8px,.65vw,13px);
    }
    .flag{
      width:clamp(28px,2vw,42px);
      aspect-ratio:4/3;
      object-fit:cover;
      border-radius:4px;
      box-shadow:0 4px 12px rgba(0,0,0,.36);
      flex:0 0 auto;
    }
    .language-copy{min-width:0}
    .native{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:clamp(13px,1.05vw,22px);
      font-weight:800;
    }
    .zh-name{
      display:block;
      margin-top:2px;
      color:var(--muted);
      font-size:clamp(9px,.66vw,13px);
    }
    .rank{
      color:#64748b;
      font-weight:900;
      font-size:clamp(11px,.75vw,15px);
      font-variant-numeric:tabular-nums;
    }
    .count{
      align-self:center;
      position:relative;
      z-index:1;
      text-align:center;
      color:#f8fafc;
      font-size:clamp(30px,3.2vw,66px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.045em;
      font-variant-numeric:tabular-nums;
      text-shadow:0 10px 30px rgba(0,0,0,.22);
    }
    .card.top-1 .count{color:var(--gold)}

    .action-metrics{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:clamp(6px,.5vw,10px);
      width:100%;
      margin:clamp(4px,.4vw,8px) 0 clamp(6px,.5vw,10px);
    }
    .action-stat{
      min-width:0;
      overflow:hidden;
      border:1px solid rgba(96,165,250,.30);
      border-radius:clamp(9px,.7vw,14px);
      padding:clamp(7px,.55vw,11px) clamp(5px,.45vw,9px);
      background:linear-gradient(
        145deg,
        rgba(30,64,175,.22),
        rgba(2,6,23,.56)
      );
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
      text-align:center;
    }
    .action-stat.purchase{
      border-color:rgba(251,191,36,.28);
      background:linear-gradient(
        145deg,
        rgba(120,53,15,.22),
        rgba(2,6,23,.56)
      );
    }
    .action-stat span{
      display:block;
      overflow:hidden;
      color:#bfdbfe;
      font-size:clamp(9px,.62vw,13px);
      font-weight:800;
      line-height:1.25;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .action-stat.purchase span{color:#fde68a}
    .action-stat strong{
      display:block;
      margin-top:clamp(3px,.25vw,5px);
      color:#60a5fa;
      font-size:clamp(16px,1.25vw,25px);
      font-weight:900;
      line-height:1;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 14px rgba(96,165,250,.20);
    }
    .action-stat.purchase strong{
      color:#fbbf24;
      text-shadow:0 0 14px rgba(251,191,36,.20);
    }
    .bottom{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
      align-items:center;
    }
    .bar{
      height:clamp(5px,.42vw,9px);
      overflow:hidden;
      border-radius:99px;
      background:#1e293b;
    }
    .bar span{
      display:block;
      width:0;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,#2563eb,#22d3ee,#fbbf24);
      transition:width .65s ease;
    }
    .share{
      color:#cbd5e1;
      font-size:clamp(9px,.68vw,14px);
      font-variant-numeric:tabular-nums;
    }
    .footer{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:20px;
      align-items:center;
      color:#64748b;
      font-size:clamp(9px,.7vw,14px);
    }
    .footer .center{text-align:center;color:#94a3b8}
    .footer .right{text-align:right}
    .loading .count{color:#64748b;font-size:clamp(18px,1.5vw,30px);letter-spacing:0}
    .error-banner{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      z-index:30;
      width:min(720px,calc(100vw - 40px));
      background:rgba(127,29,29,.92);
      border:1px solid rgba(251,113,133,.45);
      color:#fecdd3;
      padding:14px 18px;
      border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      text-align:center;
    }
    .error-banner[hidden]{display:none}
    @media(max-aspect-ratio:1.45/1){
      html,body{overflow:auto}
      .wall{height:auto;min-height:100vh}
      .header{grid-template-columns:1fr auto}
      .right-info{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;text-align:left}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:none}
    }
    @media(max-width:720px){
      .header{grid-template-columns:1fr}
      .total-box,.right-info{min-width:0;text-align:left}
      .right-info{display:block}
      .controls{justify-content:flex-start}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .footer{grid-template-columns:1fr;text-align:center}
      .footer .right{text-align:center}
    }
  </style>

</head>
